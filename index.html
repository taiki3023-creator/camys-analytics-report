const KEYNAME = "camys_report_pw";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pw, silent) {
  const msg = document.getElementById("msg");
  if (!silent) { msg.className = "msg wait"; msg.textContent = "確認しています..."; }
  try {
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256" },
      km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(NONCE) }, key, b64(DATA));
    sessionStorage.setItem(KEYNAME, pw);
    const html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  } catch (e) {
    sessionStorage.removeItem(KEYNAME);
    if (!silent) { msg.className = "msg"; msg.textContent = "番号が違います"; }
    document.getElementById("go").disabled = false;
  }
}

document.getElementById("go").addEventListener("click", () => {
  const pw = document.getElementById("pw").value.trim();
  if (!pw) return;
  document.getElementById("go").disabled = true;
  unlock(pw, false);
});
document.getElementById("pw").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("go").click();
});
// 同じセッション中はページを移動しても再入力させない
const saved = sessionStorage.getItem(KEYNAME);
if (saved) unlock(saved, true);
